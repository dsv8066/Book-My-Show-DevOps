---
- name: Deploy BookMyShow application to K3s
  hosts: local
  gather_facts: false

  vars:
    ecr_image: ""

  tasks:
    - name: Validate ECR image
      ansible.builtin.assert:
        that:
          - ecr_image | length > 0
        fail_msg: "ECR image must be provided by Jenkins."

    - name: Update Kubernetes deployment image
      ansible.builtin.command:
        argv:
          - kubectl
          - set
          - image
          - deployment/bms-app
          - "bms-container={{ ecr_image }}"
      register: image_update
      changed_when: "'image updated' in image_update.stdout"

    - name: Display image update result
      ansible.builtin.debug:
        var: image_update.stdout

    - name: Wait for Kubernetes rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/bms-app
          - --timeout=180s
      changed_when: false

    - name: Verify deployed image
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - bms-app
          - -o
          - jsonpath={.spec.template.spec.containers[0].image}
      register: deployed_image
      changed_when: false

    - name: Display deployed image
      ansible.builtin.debug:
        var: deployed_image.stdout

    - name: Verify application pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -l
          - app=bms
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        var: pod_status.stdout_lines
