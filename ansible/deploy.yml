---
- name: Deploy BookMyShow application on Kubernetes
  hosts: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Apply BookMyShow Kubernetes deployment
      command: kubectl apply -f {{ project_dir }}/deployment.yml
      register: deployment_result
      changed_when: "'configured' in deployment_result.stdout or 'created' in deployment_result.stdout"

    - name: Apply BookMyShow Kubernetes service
      command: kubectl apply -f {{ project_dir }}/service.yml
      register: service_result
      changed_when: "'configured' in service_result.stdout or 'created' in service_result.stdout"

    - name: Wait for BookMyShow deployment rollout
      command: kubectl rollout status deployment/bms-app --timeout=180s
      changed_when: false

    - name: Display Kubernetes deployment
      command: kubectl get deployments
      register: deployment_status
      changed_when: false

    - name: Display deployment status
      debug:
        var: deployment_status.stdout_lines

    - name: Display BookMyShow pods
      command: kubectl get pods -l app=bms
      register: pod_status
      changed_when: false

    - name: Show pod status
      debug:
        var: pod_status.stdout_lines
